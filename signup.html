<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원가입 | 기록의 조각</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="js/main.js" defer></script></head><body><main class="auth-shell"><section class="auth-card"><a class="logo" href="index.html">기록의 조각<span>.</span></a><h1>기록을 시작해 볼까요?</h1><p class="auth-intro">간단한 정보만 입력하면 바로 시작할 수 있어요.</p><form data-auth-form="signup" novalidate><div class="form-row"><div class="form-group"><label for="name">이름</label><input class="form-control" id="name" type="text" placeholder="홍길동" autocomplete="name" required><small class="field-error"></small></div><div class="form-group"><label for="nickname">닉네임</label><input class="form-control" id="nickname" type="text" placeholder="기록하는 사람" required><small class="field-error"></small></div></div><div class="form-group"><label for="email">이메일</label><input class="form-control" id="email" type="email" placeholder="you@example.com" autocomplete="email" required><small class="field-error"></small></div><div class="form-group"><label for="password">비밀번호</label><input class="form-control" id="password" type="password" placeholder="8자 이상 입력" autocomplete="new-password" data-minlength="8" required><small class="field-error"></small></div><div class="form-group"><label for="password-confirm">비밀번호 확인</label><input class="form-control" id="password-confirm" type="password" placeholder="비밀번호 다시 입력" autocomplete="new-password" required><small class="field-error"></small></div><div class="form-help"><label class="check-label"><input type="checkbox" required> 이용약관 및 개인정보 처리방침에 동의합니다.</label></div><button class="full-button" type="submit">회원가입</button></form><p class="auth-switch">이미 계정이 있나요? <a href="login.html">로그인</a></p></section></main><div class="toast" role="status" aria-live="polite"></div></body></html>
