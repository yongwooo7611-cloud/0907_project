<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>글쓰기 | 기록의 조각</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="js/main.js" defer></script></head><body data-requires-auth><a class="skip-link" href="#main-content">본문으로 바로가기</a>
<header class="site-header"><div class="container header-inner"><a class="logo" href="index.html">기록의 조각<span>.</span></a><nav class="site-nav"><button class="menu-toggle" aria-expanded="false"><span class="sr-only">메뉴 열기</span><span></span><span></span><span></span></button><ul class="nav-list"><li><a href="index.html">글</a></li><li><a href="profile.html">프로필</a></li><li><a class="is-active" href="write.html">글쓰기</a></li></ul></nav><div class="header-actions"><button class="theme-toggle" aria-label="다크 모드로 전환"><span class="theme-icon">☾</span></button><a class="text-button" href="profile.html">내 프로필</a></div></div></header>
<main id="main-content"><section class="write-shell"><p class="eyebrow">NEW STORY</p><h1>새로운 기록</h1><form id="write-form"><div class="form-group"><label for="post-title">제목</label><input class="form-control" id="post-title" type="text" placeholder="이야기의 제목을 입력하세요" required></div><div class="form-row"><div class="form-group"><label for="post-category">카테고리</label><select class="form-control" id="post-category"><option>개발</option><option>회고</option><option>일상</option><option>책</option></select></div><div class="form-group"><label for="post-tags">태그</label><input class="form-control" id="post-tags" type="text" placeholder="쉼표로 구분해 주세요"></div></div><div class="form-group"><label for="post-summary">한 줄 소개</label><input class="form-control" id="post-summary" type="text" placeholder="목록에 표시할 짧은 소개"></div><div class="form-group"><label for="post-body">본문</label><div class="write-toolbar" aria-label="텍스트 서식"><button type="button" data-format="bold" title="굵게">B</button><button type="button" data-format="italic" title="기울임">I</button><button type="button" data-format="quote" title="인용">“</button><button type="button" data-format="link" title="링크">↗</button></div><textarea class="form-control editor" id="post-body" placeholder="당신의 이야기를 들려주세요..." required></textarea></div><div class="write-actions"><button class="secondary-button" id="save-draft" type="button">임시 저장</button><button class="primary-button" type="submit">글 발행하기</button></div></form></section></main><footer class="site-footer"><div class="container"><a class="logo" href="index.html">기록의 조각<span>.</span></a><div></div><p>© <span id="current-year"></span> Yongwoo.</p></div></footer><div class="toast" role="status" aria-live="polite"></div></body></html>
