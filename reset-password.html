<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>비밀번호 재설정 | 기록의 조각</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card reset-card">
      <a class="logo" href="index.html">기록의 조각<span>.</span></a>
      <h1>비밀번호 재설정</h1>
      <p class="auth-intro">가입한 이메일로 받은 인증번호를 이용해 새 비밀번호를 설정하세요.</p>

      <section class="reset-step">
        <h2>1. 인증번호 받기</h2>
        <form id="reset-request-form">
          <div class="form-group">
            <label for="reset-request-email">이메일</label>
            <input class="form-control" id="reset-request-email" type="email" autocomplete="email" placeholder="you@example.com" required>
          </div>
          <button class="full-button" type="submit">인증번호 보내기</button>
        </form>
      </section>

      <section class="reset-step">
        <h2>2. 새 비밀번호 설정</h2>
        <form id="reset-confirm-form">
          <div class="form-group">
            <label for="reset-email">이메일</label>
            <input class="form-control" id="reset-email" type="email" autocomplete="email" required>
          </div>
          <div class="form-group">
            <label for="reset-code">인증번호</label>
            <input class="form-control" id="reset-code" type="text" maxlength="6" autocomplete="one-time-code" placeholder="6자리 인증번호" required>
          </div>
          <div class="form-group">
            <label for="reset-password">새 비밀번호</label>
            <input class="form-control" id="reset-password" type="password" minlength="8" maxlength="72" autocomplete="new-password" placeholder="8자 이상 입력" required>
          </div>
          <div class="form-group">
            <label for="reset-password-confirm">새 비밀번호 확인</label>
            <input class="form-control" id="reset-password-confirm" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
          </div>
          <button class="full-button" type="submit">비밀번호 변경</button>
        </form>
      </section>
      <p class="auth-switch"><a href="login.html">로그인으로 돌아가기</a></p>
    </section>
  </main>
  <div class="toast" role="status" aria-live="polite"></div>
</body>
</html>
