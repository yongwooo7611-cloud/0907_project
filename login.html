<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 | 기록의 조각</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="js/main.js" defer></script></head><body><main class="auth-shell"><section class="auth-card"><a class="logo" href="index.html">기록의 조각<span>.</span></a><h1>다시 만나 반가워요.</h1><p class="auth-intro">기록을 이어서 작성하려면 로그인해 주세요.</p><form data-auth-form="login" novalidate><div class="form-group"><label for="email">이메일</label><input class="form-control" id="email" type="email" placeholder="you@example.com" autocomplete="email" required><small class="field-error"></small></div><div class="form-group"><label for="password">비밀번호</label><input class="form-control" id="password" type="password" placeholder="비밀번호 입력" autocomplete="current-password" required><small class="field-error"></small></div><div class="form-help"><label class="check-label"><input type="checkbox"> 로그인 상태 유지</label><a href="#">비밀번호 찾기</a></div><button class="full-button" type="submit">로그인</button></form><p class="auth-switch">아직 계정이 없나요? <a href="signup.html">회원가입</a></p></section></main><div class="toast" role="status" aria-live="polite"></div></body></html>
