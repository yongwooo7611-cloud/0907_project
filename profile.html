<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>프로필 | 기록의 조각</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body data-requires-auth>
  <a class="skip-link" href="#main-content">본문으로 바로가기</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">기록의 조각<span>.</span></a>
      <nav class="site-nav" aria-label="주요 메뉴">
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="profile-nav-list"><span class="sr-only">메뉴 열기</span><span></span><span></span><span></span></button>
        <ul class="nav-list" id="profile-nav-list"><li><a href="index.html">글</a></li><li><a class="is-active" href="profile.html">프로필</a></li><li><a href="write.html">글쓰기</a></li></ul>
      </nav>
      <div class="header-actions"><button class="theme-toggle" type="button" aria-label="다크 모드로 전환"><span class="theme-icon">☾</span></button><a class="text-button" href="login.html">로그인</a><a class="mini-button" href="signup.html">회원가입</a></div>
    </div>
  </header>
  <main id="main-content" class="page-main">
    <header class="page-heading"><div class="container"><p class="eyebrow">MY PROFILE</p><h1 id="profile-heading">프로필</h1><p>계정 정보와 작성한 글을 관리할 수 있습니다.</p></div></header>
    <section class="content-section">
      <div class="container profile-account-layout">
        <aside class="profile-card">
          <div class="profile-initials" id="profile-initials" aria-hidden="true"></div>
          <h2 id="profile-name">불러오는 중</h2>
          <p class="role" id="profile-nickname"></p>
          <p id="profile-email"></p>
          <p class="profile-joined" id="profile-created-at"></p>
        </aside>
        <div>
          <div class="my-posts-heading"><div><p class="eyebrow">MY STORIES</p><h2>내가 작성한 글</h2></div><a class="primary-button write-link" href="write.html">새 글 작성</a></div>
          <div id="my-posts" class="my-posts-list" aria-live="polite"><p class="list-message">작성한 글을 불러오는 중입니다.</p></div>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer"><div class="container"><a class="logo" href="index.html">기록의 조각<span>.</span></a><div class="footer-links"><a href="index.html">글</a><a href="write.html">글쓰기</a></div><p>© <span id="current-year"></span> 기록의 조각.</p></div></footer>
  <div class="toast" role="status" aria-live="polite"></div>
</body>
</html>
